# Config that reproduces the official baseline_smooth50 (spellF1 0.2433 on the full match).
# `make check-baseline` will compare our output with the organisers' published file.
#
# Will contain:
#   ball:       method none             (no gap filling)
#   deadball:   method ball_missing     (D wherever the ball is not observed)
#   possession: method nearest_majority, window 50   (majority vote over +/- 50 frames)
